name: Update LLM Data

on:
  schedule:
    - cron: '0 8 * * *'   # cada día a las 8:00 UTC
  workflow_dispatch:        # también ejecutable a mano desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar datos AA API
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python fetch_data.py

      - name: Descargar modelos de Ollama
        run: python fetch_ollama.py

      - name: Descargar parámetros desde HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python fetch_hf_params.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/ollama_models.json data/hf_params.json
          git diff --staged --quiet && echo "Sin cambios, nada que commitear." && exit 0
          git commit -m "data: actualización diaria $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && exit 0
            echo "Push rechazado, reintento $i/3..."
            git pull --rebase origin main
          done
          echo "Error: no se pudo hacer push tras 3 intentos." && exit 1
