name: Test HF Params

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar parámetros desde HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python fetch_hf_params.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hf_params.json
          git diff --staged --quiet && echo "Sin cambios." && exit 0
          git commit -m "data: hf_params actualizado $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
